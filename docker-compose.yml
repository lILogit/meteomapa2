# METEOMAPA on a Hostinger VPS — routed by Traefik (TLS via Let's Encrypt).
#
# Follows the Hostinger "connect multiple Compose projects with Traefik" convention:
# one Traefik project owns :80/:443 for the whole VPS, every app joins its external
# `traefik-proxy` network, no app publishes a public port, and each app names its
# router after its Compose project so nothing collides on the shared proxy.
#
#  A) SHARED PROXY (default) — deploy alongside Hostinger's Traefik project:
#         cp .env.example .env && docker compose up -d --build
#     Hostname (see the rule below):
#       - set TRAEFIK_HOST=<base domain> → served at <project>.<TRAEFIK_HOST>,
#         which needs no per-project DNS if that base domain has a wildcard record;
#       - or set DOMAIN_NAME=<fqdn> for a custom domain (its A record must point at
#         the VPS BEFORE the first request, or the ACME challenge fails).
#     Setting neither is a hard error, not a silent bad hostname.
#
#  B) STANDALONE (VPS without the Hostinger template)
#     The bundled proxy lives in a SEPARATE file so a plain `up` can never start it
#     and fight the shared proxy for :80/:443. Opt in explicitly:
#         docker network create traefik-proxy    # once, if it doesn't exist
#         docker compose -f docker-compose.yml -f docker-compose.standalone.yml up -d --build
#     Only ONE proxy may bind :80/:443 per host: if another project (e.g. CORTEX)
#     already runs a Traefik, use shape (A) and join its network instead.
#
# ONE env file, named exactly `.env`, next to this compose file. Docker Compose
# has two independent variable-lookup paths: `${DOMAIN_NAME}`-style interpolation
# in this YAML (which Compose reads from a file literally named `.env` by
# default, with NO flag needed) and `env_file:` below (which populates the `app`
# container's actual runtime environment). They do not merge or fall back to
# each other. Naming both paths at `.env` means plain `docker compose up -d
# --build` just works, with zero flags to remember. cp .env.example .env here.
services:
  app:
    build:
      context: .
    image: meteomapa:latest
    container_name: meteomapa
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Persist cache/subscriptions on the mounted volume. Overrides CACHE_DIR in .env.
      CACHE_DIR: /data
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - data:/data
    networks:
      # The shared proxy network — this is how Traefik reaches the app, on :8000.
      - traefik-proxy
    ports:
      # loopback only — for SSH-tunnel debugging (`ssh -L 8765:localhost:8765 vps`).
      # Traefik never uses this; it talks to the container over the proxy network.
      # 8765 avoids colliding with other local apps (e.g. CORTEX on :8000).
      # Drop this line entirely if you want zero host ports.
      - "127.0.0.1:8765:8000"
    labels:
      - traefik.enable=true
      # DOMAIN_NAME wins if set; otherwise <project>.<TRAEFIK_HOST>, per the Hostinger
      # guide. The `:?` fires ONLY when that fallback is taken (verified), so a custom
      # domain needs no TRAEFIK_HOST, and setting neither fails with this message
      # instead of deploying the malformed host `meteomapa.`.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${DOMAIN_NAME:-${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST:?set TRAEFIK_HOST (shared base domain) or DOMAIN_NAME (custom fqdn) in .env}}`)
      # HTTPS only; the shared proxy already redirects :80 → :443 for every project.
      # certresolver implies TLS, so no separate tls=true is needed.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      # The app listens on 8000 inside the container (see Dockerfile EXPOSE).
      # Required: with several networks/ports around, Traefik won't guess.
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8000
      # Which network to reach the container on, when it sits on more than one.
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-proxy}
      # HSTS + sniffing/XSS hardening. No SSLRedirect/SSLHost here: the redirect is
      # the shared proxy's job, and SSLHost would need a literal host that does not
      # exist in TRAEFIK_HOST mode.
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-headers.headers.STSSeconds=315360000
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-headers.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-headers.headers.STSPreload=true
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-headers.headers.browserXSSFilter=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${COMPOSE_PROJECT_NAME}-headers@docker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # Created by whoever owns the proxy — the Hostinger Traefik project in shape (A),
  # or `docker network create traefik-proxy` in shape (B). External either way, so
  # Compose joins the existing network instead of making a per-project one.
  # `name:` lets TRAEFIK_NETWORK retarget it if that project uses another name.
  traefik-proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-proxy}

volumes:
  data:
